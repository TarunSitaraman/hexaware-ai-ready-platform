bundle:
  name: hexaware_ai_ready_platform

resources:
  jobs:
    medallion_pipeline:
      name: "Medallion Data Pipeline"
      tasks:
        - task_key: data_ingestion
          notebook_task:
            notebook_path: ./notebooks/01_Data_Ingestion.py
          job_cluster_key: job_cluster
        - task_key: bronze_layer
          depends_on:
            - task_key: data_ingestion
          notebook_task:
            notebook_path: ./notebooks/02_Bronze_Layer.py
          job_cluster_key: job_cluster
        - task_key: silver_layer
          depends_on:
            - task_key: bronze_layer
          notebook_task:
            notebook_path: ./notebooks/03_Silver_Layer.py
          job_cluster_key: job_cluster
        - task_key: gold_layer
          depends_on:
            - task_key: silver_layer
          notebook_task:
            notebook_path: ./notebooks/04_Gold_Layer.py
          job_cluster_key: job_cluster
        - task_key: dq_validation
          depends_on:
            - task_key: gold_layer
          notebook_task:
            notebook_path: ./notebooks/05_Data_Quality_Validation.py
          job_cluster_key: job_cluster
        - task_key: feature_engineering
          depends_on:
            - task_key: gold_layer
          notebook_task:
            notebook_path: ./notebooks/06_Feature_Engineering.py
          job_cluster_key: job_cluster
        - task_key: machine_learning
          depends_on:
            - task_key: feature_engineering
          notebook_task:
            notebook_path: ./notebooks/07_Machine_Learning.py
          job_cluster_key: job_cluster
        - task_key: reporting
          depends_on:
            - task_key: machine_learning
          notebook_task:
            notebook_path: ./notebooks/08_Reporting.py
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 2

targets:
  dev:
    workspace:
      host: "https://<dev-workspace-url>"
    default: true
  prod:
    workspace:
      host: "https://<prod-workspace-url>"
